# Run armbian/build's ./compile.sh inside a Linux container (Docker Desktop on Windows/macOS,
# or plain Docker on Linux) with the WuKong Pi board support from userpatches/.
#
#   docker compose build
#   docker compose run --rm build BOARD=wukongpi BRANCH=current RELEASE=trixie \
#       BUILD_MINIMAL=no BUILD_DESKTOP=no KERNEL_CONFIGURE=no
#   docker compose run --rm build shell                # shell inside the build environment
#
# Images and .deb packages end up in ./output on the host.
# armbian/build is checked out at the ref from ARMBIAN_REF on every start (override with
# ARMBIAN_REF=... in the environment), see docker/entrypoint.sh.

services:
  build:
    build:
      context: docker
    image: wukongpi-build:noble
    # loop devices, mount, binfmt_misc and mknod are needed to assemble the SD card image
    privileged: true
    security_opt:
      - apparmor:unconfined
    # default bridge: DNS goes straight to the Docker Desktop resolver instead of
    # the embedded one of a compose network, which drops more queries under load
    network_mode: bridge
    stdin_open: true
    tty: true
    environment:
      - ARMBIAN_REF
      # ~300 MB kernel git tarball per kernel version instead of the ~5 GB full one
      - KERNEL_GIT=${KERNEL_GIT:-shallow}
    volumes:
      - .:/src:ro
      # the framework, rootfs and kernel trees must live on a Linux filesystem: an NTFS
      # bind mount has no symlinks, device nodes or ownership and is case-insensitive
      - armbian-build:/root/armbian
      - ./output:/root/armbian/output
      - armbian-build-cache:/root/armbian/cache
      - armbian-build-tmp:/root/armbian/.tmp
      # loop partitions (/dev/loopNpM) appear after the container starts; the framework
      # recreates them from here with mknod (CONTAINER_COMPAT)
      - /dev:/tmp/dev:ro

volumes:
  armbian-build:
  armbian-build-cache:
  armbian-build-tmp:
