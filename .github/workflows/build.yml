name: Build WukongPi OS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - armbian-upstream

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        release: [noble, resolute, trixie]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build OS image
        # same container and entrypoint as a local build, see docker-compose.yml
        run: |
          docker compose build
          docker compose run --rm -T build \
            BOARD=wukongpi \
            BRANCH=current \
            RELEASE=${{ matrix.release }} \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wukongpi-${{ matrix.release }}
          path: ./output/images/*
          retention-days: 90
